<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        /* Subtle grid matching your screenshot's background */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-[#060a13] bg-grid-pattern text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#101726] rounded-t-lg rounded-b-xl shadow-2xl relative overflow-hidden flex flex-col">
        
        <div class="w-full h-2 bg-[#eab308]"></div>

        <div class="p-8">
            <div class="flex flex-col items-center mb-10 mt-2">
                <div class="w-12 h-12 rounded-sm bg-[#eab308] flex items-center justify-center mb-4 shadow-lg">
                    <span class="font-black text-slate-900 text-xl tracking-wide">KFX</span>
                </div>
                
                <h1 class="text-[28px] sm:text-3xl font-black tracking-[0.25em] text-white text-center uppercase leading-none">
                    KFX GLOBAL
                </h1>
                
                <p class="font-mono-code text-[11px] sm:text-xs font-semibold tracking-[0.2em] text-slate-400 mt-3 uppercase text-center">
                    Intelligence Terminal Access
                </p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        Authentication Email
                    </label>
                    <input type="email" id="email" 
                           class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                           placeholder="Enter your email" required>
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                            Credential
                        </label>
                        <a href="/forgot-password" class="text-[10px] font-mono-code font-bold text-slate-500 hover:text-[#eab308] transition-colors uppercase tracking-wider">
                            Reset?
                        </a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" 
                               class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 pr-12 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                               placeholder="Enter your password" required>
                        <button type="button" onclick="togglePassword('password', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-900">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full bg-[#eab308] hover:bg-[#d97706] text-slate-950 font-black text-sm uppercase tracking-[0.2em] rounded-md py-4 mt-2 transition duration-150 shadow-md active:scale-[0.99] disabled:opacity-75 disabled:cursor-not-allowed">
                    Enter Portal
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="mailto:kfxglobal383@gmail.com?subject=Login%20Assistance%20Required" 
                   class="inline-flex items-center justify-center gap-2 text-[11px] font-mono-code font-bold text-slate-400 hover:text-[#eab308] transition-colors uppercase tracking-wider bg-[#1e293b] px-4 py-2 rounded-md shadow-sm border border-slate-700/50 hover:border-[#eab308]/50">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                    </svg>
                    Need help logging in?
                </a>
            </div>
            <div id="alertBox" class="hidden mt-5 text-sm font-mono-code font-medium text-center"></div>

            <div class="text-center mt-8">
                <p class="text-[11px] font-mono-code text-slate-500 tracking-wide uppercase">
                    New to the platform? 
                    <a href="/register" class="text-[#eab308] hover:text-white font-bold ml-1 transition-colors">
                        Sign up
                    </a>
                </p>
            </div>
        </div>
    </div>
<script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'text-red-400', 'text-emerald-400');
            if (type === 'error') {
                alertBox.classList.add('text-red-400');
            } else {
                alertBox.classList.add('text-emerald-400');
            }
            alertBox.innerText = message;
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            submitBtn.innerText = "AUTHENTICATING...";
            alertBox.classList.add('hidden'); // hide alert on new attempt

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    // Saves the email to local storage
                    if (data.email) {
                        localStorage.setItem('user_email', data.email);
                    }
                    
                    showAlert(data.message || "Login successful!", "success");
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1000);
                } else {
                    showAlert(data.error || "System error verifying access. Try again.");
                    
                    // 👇 THIS IS THE NEW FIX: Auto-Redirect for Inactive Subscriptions 👇
                    if (data.error && data.error.toLowerCase().includes("subscription inactive")) {
                        submitBtn.innerText = "REDIRECTING TO RENEWAL...";
                        setTimeout(() => {
                            // ⚠️ REPLACE THE LINK BELOW WITH YOUR ACTUAL PAYMENT LINK ⚠️
                            window.location.href = "https://your-payment-link-here.com"; 
                        }, 1500); // Waits 1.5 seconds so the user can read the red error text
                        return; // Stops the rest of the code from running
                    }
                    // 👆 END OF NEW FIX 👆

                    submitBtn.disabled = false;
                    submitBtn.innerText = "ENTER PORTAL";
                    
                    if (data.redirect_url) {
                        setTimeout(() => {
                            window.location.href = data.redirect_url;
                        }, 2000);
                    }
                }
            } catch (err) {
                showAlert("System error verifying access. Try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "ENTER PORTAL";
            }
        }

        // Toggles password visibility and changes the eye icon
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                // Change to Eye-Slash icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
            } else {
                input.type = 'password';
                // Change back to Eye icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
            }
        }
</script>
</body>
</html>
