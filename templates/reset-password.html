<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Create New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between">
    <div>
        <div class="px-6 flex items-center gap-4 mb-8 mt-12">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-400 via-purple-400 to-indigo-400 shadow-sm flex-shrink-0"></div>
            <div>
                <p class="text-gray-800 font-semibold text-lg leading-tight">Almost there</p>
                <h1 class="text-2xl font-bold tracking-tight mt-0.5">Create new password</h1>
            </div>
        </div>

        <div class="px-6 pb-8">
            <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium text-center"></div>

            <form id="resetForm" onsubmit="handleReset(event)" class="flex flex-col gap-4">
                <input type="hidden" id="token" value="{{ token }}">
                
                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">New Password</label>
                    <input type="password" id="password" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="Enter new password" required minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white font-bold text-base rounded-xl py-4 mt-2 transition duration-200 hover:bg-black">
                    Update Password
                </button>
            </form>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
            alertBox.innerText = message;
        }

        async function handleReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const token = document.getElementById('token').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Updating...";
            submitBtn.classList.add('opacity-75');

            try {
                const response = await fetch(`/api/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert("Password updated successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 1500);
                } else {
                    showAlert(data.error || "Failed to update password.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Update Password";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("Server error. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Update Password";
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
