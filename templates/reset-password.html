<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Create New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        /* Subtle grid matching the background */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-[#060a13] bg-grid-pattern text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#101726] rounded-t-lg rounded-b-xl shadow-2xl relative overflow-hidden flex flex-col">
        
        <div class="w-full h-2 bg-[#eab308]"></div>

        <div class="p-8">
            <div class="flex flex-col items-center mb-10 mt-2">
                <div class="w-12 h-12 rounded-sm bg-[#eab308] flex items-center justify-center mb-4 shadow-lg">
                    <span class="font-black text-slate-900 text-xl tracking-wide">KFX</span>
                </div>
                
                <h1 class="text-[28px] sm:text-3xl font-black tracking-[0.25em] text-white text-center uppercase leading-none">
                    KFX GLOBAL
                </h1>
                
                <p class="font-mono-code text-[11px] sm:text-xs font-semibold tracking-[0.2em] text-slate-400 mt-3 uppercase text-center">
                    Account Recovery Portal
                </p>
            </div>

            <form id="resetForm" onsubmit="handleReset(event)" class="flex flex-col gap-5">
                <input type="hidden" id="token" value="{{ token }}">
                
                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        New Credential
                    </label>
                    <input type="password" id="password" 
                           class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                           placeholder="Enter new password" required minlength="6">
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full bg-[#eab308] hover:bg-[#d97706] text-slate-950 font-black text-sm uppercase tracking-[0.2em] rounded-md py-4 mt-3 transition duration-150 shadow-md active:scale-[0.99] disabled:opacity-75 disabled:cursor-not-allowed">
                    Update Password
                </button>
            </form>

            <div id="alertBox" class="hidden mt-5 text-sm font-mono-code font-medium text-center"></div>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'text-red-400', 'text-emerald-400');
            if (type === 'error') {
                alertBox.classList.add('text-red-400');
            } else {
                alertBox.classList.add('text-emerald-400');
            }
            alertBox.innerText = message;
        }

        async function handleReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const token = document.getElementById('token').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "PROCESSING...";
            submitBtn.classList.add('opacity-75');
            alertBox.classList.add('hidden'); // Hide previous alerts

            try {
                const response = await fetch(`/api/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert("Password updated successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 1500);
                } else {
                    showAlert(data.error || "Failed to update password.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "UPDATE PASSWORD";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("System error verifying access. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "UPDATE PASSWORD";
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
