<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Verify Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between">
    <div>
        <div class="px-6 flex items-center gap-4 mb-8 mt-12">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-400 via-purple-400 to-indigo-400 shadow-sm flex-shrink-0"></div>
            <div>
                <p class="text-gray-800 font-semibold text-lg leading-tight">Security Check</p>
                <h1 class="text-2xl font-bold tracking-tight mt-0.5">Verify your email</h1>
            </div>
        </div>

        <div class="px-6">
            <p class="text-sm text-gray-600 mb-6 font-medium">
                We've sent a 6-digit verification code to <br>
                <span id="displayEmail" class="font-bold text-gray-900"></span>.
            </p>

            <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium text-center"></div>

            <form id="verifyForm" onsubmit="handleVerify(event)" class="flex flex-col gap-5">
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-sm text-gray-900">Enter Verification Code</label>
                    <input type="text" id="code" class="w-full border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-gray-900 text-center tracking-widest text-lg" placeholder="123456" maxlength="6" required>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white font-bold text-base rounded-xl py-4 mt-2 transition duration-200 hover:bg-black">
                    Verify & Proceed to Payment
                </button>
            </form>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        
        // Grab the email from the URL (e.g. /verify?email=test@test.com)
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');
        
        if (userEmail) {
            document.getElementById('displayEmail').innerText = userEmail;
        } else {
            document.getElementById('displayEmail').innerText = "your email";
        }

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
            alertBox.innerText = message;
        }

        async function handleVerify(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();

            if (!userEmail) {
                showAlert("Email missing. Please try logging in again.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying Code...";
            submitBtn.classList.add('opacity-75');

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, code: code })
                });
                const data = await response.json();

                if (response.ok && data.checkout_url) {
                    showAlert(data.message, "success");
                    setTimeout(() => {
                        window.location.href = data.checkout_url;
                    }, 1500);
                } else {
                    showAlert(data.error || "Verification failed.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Verify & Proceed to Payment";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("Server error. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Verify & Proceed to Payment";
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
