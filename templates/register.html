<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between">
    <div>
        <div class="px-6 flex items-center gap-4 mb-8 mt-12">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-400 via-purple-400 to-indigo-400 shadow-sm flex-shrink-0"></div>
            <div>
                <p class="text-gray-800 font-semibold text-lg leading-tight">Join KFX Global</p>
                <h1 class="text-2xl font-bold tracking-tight mt-0.5">Create your profile</h1>
            </div>
        </div>

        <div class="px-6 pb-8">
            <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium text-center"></div>

            <form id="registerForm" onsubmit="handleRegister(event)" class="flex flex-col gap-4">
                
                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">Full Name</label>
                    <input type="text" id="fullName" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="John Doe" required>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">Phone Number</label>
                    <input type="tel" id="phoneNumber" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="+234 800 000 0000" required>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">Email Address</label>
                    <input type="email" id="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="Enter your email" required>
                </div>

                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">Password</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="Create a strong password" required>
                        <button type="button" onclick="togglePassword('password', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-gray-900">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white font-bold text-base rounded-xl py-4 mt-2 transition duration-200 hover:bg-black">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-sm font-bold text-gray-900">
                    Already have an account? 
                    <a href="/" class="text-[#b91c1c] hover:underline ml-1">Log in</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
            alertBox.innerText = message;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById('fullName').value.trim();
            const phone_number = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Creating Profile & Sending Code...";
            submitBtn.classList.add('opacity-75');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, phone_number, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, "success");
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1500);
                } else {
                    showAlert(data.error || "Registration failed.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Create Account";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("Server error. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account";
                submitBtn.classList.remove('opacity-75');
            }
        }

        // Toggles password visibility and changes the eye icon
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                // Change to Eye-Slash icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
            } else {
                input.type = 'password';
                // Change back to Eye icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
            }
        }
    </script>
</body>
</html>
