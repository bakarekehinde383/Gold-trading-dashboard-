<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        /* Subtle grid matching the background */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-[#060a13] bg-grid-pattern text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#101726] rounded-t-lg rounded-b-xl shadow-2xl relative overflow-hidden flex flex-col my-8">
        
        <div class="w-full h-2 bg-[#eab308]"></div>

        <div class="p-8">
            <div class="flex flex-col items-center mb-10 mt-2">
                <div class="w-12 h-12 rounded-sm bg-[#eab308] flex items-center justify-center mb-4 shadow-lg">
                    <span class="font-black text-slate-900 text-xl tracking-wide">KFX</span>
                </div>
                
                <h1 class="text-[28px] sm:text-3xl font-black tracking-[0.25em] text-white text-center uppercase leading-none">
                    KFX GLOBAL
                </h1>
                
                <p class="font-mono-code text-[11px] sm:text-xs font-semibold tracking-[0.2em] text-slate-400 mt-3 uppercase text-center">
                    New Profile Registration
                </p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)" class="flex flex-col gap-5">
                
                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        Full Name
                    </label>
                    <input type="text" id="fullName" 
                           class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                           placeholder="John Doe" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        Phone Number
                    </label>
                    <input type="tel" id="phoneNumber" 
                           class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                           placeholder="+234 800 000 0000" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        Email Address
                    </label>
                    <input type="email" id="email" 
                           class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                           placeholder="Enter your email" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-mono-code text-[10px] font-bold text-slate-400 tracking-[0.15em] uppercase">
                        Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password" 
                               class="w-full bg-[#f8fafc] border-none rounded-md px-4 py-3.5 pr-12 text-slate-900 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-[#eab308] transition-all" 
                               placeholder="Create a strong password" required>
                        <button type="button" onclick="togglePassword('password', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-500 hover:text-slate-900">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full bg-[#eab308] hover:bg-[#d97706] text-slate-950 font-black text-sm uppercase tracking-[0.2em] rounded-md py-4 mt-3 transition duration-150 shadow-md active:scale-[0.99] disabled:opacity-75 disabled:cursor-not-allowed">
                    Create Account
                </button>
            </form>

            <div id="alertBox" class="hidden mt-5 text-sm font-mono-code font-medium text-center"></div>

            <div class="text-center mt-8">
                <p class="text-[11px] font-mono-code text-slate-500 tracking-wide uppercase">
                    Already have an account? 
                    <a href="/" class="text-[#eab308] hover:text-white font-bold ml-1 transition-colors">
                        Log in
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'text-red-400', 'text-emerald-400');
            if (type === 'error') {
                alertBox.classList.add('text-red-400');
            } else {
                alertBox.classList.add('text-emerald-400');
            }
            alertBox.innerText = message;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById('fullName').value.trim();
            const phone_number = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "PROCESSING...";
            submitBtn.classList.add('opacity-75');
            alertBox.classList.add('hidden'); // hide alert on new attempt

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, phone_number, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, "success");
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 1500);
                } else {
                    showAlert(data.error || "Registration failed.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "CREATE ACCOUNT";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("System error during registration. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "CREATE ACCOUNT";
                submitBtn.classList.remove('opacity-75');
            }
        }

        // Toggles password visibility and changes the eye icon
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                // Change to Eye-Slash icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
            } else {
                input.type = 'password';
                // Change back to Eye icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
            }
        }
    </script>
</body>
</html>
