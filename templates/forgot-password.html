<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-[#080b11] bg-grid-pattern text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#0d131f]/90 border border-slate-800/80 rounded-lg shadow-2xl p-6 sm:p-8 backdrop-blur-md relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600"></div>

        <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 rounded-md bg-[#d97706] bg-opacity-90 border border-yellow-300/40 flex items-center justify-center font-black text-slate-950 text-xl tracking-wider shadow-lg mb-4">
                KFX
            </div>
            
            <h1 class="text-3xl sm:text-4xl font-black tracking-[0.2em] text-white text-center uppercase">
                KFX GLOBAL
            </h1>
            <p class="font-mono-code text-xs font-semibold tracking-[0.25em] text-slate-400 mt-1 uppercase text-center">
                Account Recovery Portal
            </p>
        </div>

        <div id="alertBox" class="hidden mb-5 p-3 rounded text-xs font-mono-code font-medium text-center border"></div>

        <p class="text-xs font-mono-code text-slate-400 mb-6 text-center leading-relaxed">
            Enter your registered email address to receive a secure password recovery link.
        </p>

        <form id="forgotForm" onsubmit="handleForgot(event)" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label class="font-mono-code text-[11px] font-bold text-slate-400 tracking-wider uppercase">
                    Authentication Email
                </label>
                <input type="email" id="email" 
                       class="w-full bg-[#e2e8f0] border border-slate-300 rounded px-4 py-3 text-slate-950 font-mono-code font-bold text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all placeholder-slate-500" 
                       placeholder="Enter your email" required>
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full bg-[#eab308] hover:bg-[#d97706] text-slate-950 font-black text-sm uppercase tracking-widest rounded py-3.5 mt-1 transition duration-150 shadow-md active:scale-[0.99]">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-800/60">
            <p class="text-xs font-mono-code text-slate-400">
                Remembered your password? 
                <a href="/" class="text-amber-400 hover:text-amber-300 font-bold underline ml-1">
                    Enter Portal
                </a>
            </p>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-950/80', 'text-red-400', 'border-red-800/80', 'bg-emerald-950/80', 'text-emerald-400', 'border-emerald-800/80');
            if (type === 'error') {
                alertBox.classList.add('bg-red-950/80', 'text-red-400', 'border-red-800/80');
            } else {
                alertBox.classList.add('bg-emerald-950/80', 'text-emerald-400', 'border-emerald-800/80');
            }
            alertBox.innerText = message;
        }

        async function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();

            submitBtn.disabled = true;
            submitBtn.innerText = "SENDING LINK...";
            submitBtn.classList.add('opacity-75');

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, "success");
                    submitBtn.innerText = "CHECK YOUR EMAIL";
                } else {
                    showAlert(data.error || "Failed to send link.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "SEND RESET LINK";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("System error verifying access. Try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "SEND RESET LINK";
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
