<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFX Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between">
    <div>
        <div class="px-6 flex items-center gap-4 mb-8 mt-12">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-400 via-purple-400 to-indigo-400 shadow-sm flex-shrink-0"></div>
            <div>
                <p class="text-gray-800 font-semibold text-lg leading-tight">Account Recovery</p>
                <h1 class="text-2xl font-bold tracking-tight mt-0.5">Reset your password</h1>
            </div>
        </div>

        <div class="px-6 pb-8">
            <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium text-center"></div>
            <p class="text-sm text-gray-600 mb-6 font-medium">Enter your email address and we'll send you a secure link to reset your password.</p>

            <form id="forgotForm" onsubmit="handleForgot(event)" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="font-bold text-sm text-gray-900">Email Address</label>
                    <input type="email" id="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 font-medium focus:outline-none focus:ring-2 focus:ring-gray-900" placeholder="Enter your email" required>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white font-bold text-base rounded-xl py-4 mt-2 transition duration-200 hover:bg-black">
                    Send Reset Link
                </button>
            </form>

            <div class="text-center mt-6">
                <p class="text-sm font-bold text-gray-900">
                    Remembered it? 
                    <a href="/" class="text-[#b91c1c] hover:underline ml-1">Log in</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-600');
            }
            alertBox.innerText = message;
        }

        async function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Link...";
            submitBtn.classList.add('opacity-75');

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, "success");
                    submitBtn.innerText = "Check your email";
                } else {
                    showAlert(data.error || "Failed to send link.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Send Reset Link";
                    submitBtn.classList.remove('opacity-75');
                }
            } catch (err) {
                showAlert("Server error. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Reset Link";
                submitBtn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
